# GoReleaser: binaries + checksums + container image, on every v* tag.
# Release with: git tag v0.1.0 && git push origin v0.1.0
version: 2

project_name: discord-backup

builds:
  - id: discord-backup
    main: .
    binary: discord-backup
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/**

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github

# Container images are NOT built here: the deprecated `dockers` block cannot
# push multi-arch manifests ("docker exporter does not support exporting
# manifest lists"). Tags (:latest from main, :vX.Y.Z from tags) are published
# by .github/workflows/docker.yml with the same Dockerfile instead.
