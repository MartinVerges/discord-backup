name: Docker

# Publishes multi-arch images (amd64 + arm64) to ghcr.io:
#   - every main commit  -> :latest
#   - every version tag  -> :YYMM.x (e.g. :2610.1)
# Image publishing lives here (not in the Release workflow): the same
# Dockerfile is used for both, and plain docker/build-push-action handles
# manifest lists correctly.
on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/martinverges/discord-backup
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamps the version the binary reports: the tag (2610.1) on a
          # release, "dev" for a main build.
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
