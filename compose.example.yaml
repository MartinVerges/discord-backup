# Example: one configuration file drives everything. The backup service and the
# MCP service read the same file; there is no token file and no .env.
#
#   cp config.example.json config.json
#     #   "archive_dir": "/data"        (container path!)
#     #   "token": "<bot token>"
#     #   "backup": {"every": "15m"}    (self-scheduling, no cron needed)
#     #   "mcp": {"http_addr": "0.0.0.0:8765",   <-- 0.0.0.0, NOT 127.0.0.1!
#     #           "principals": [...]}           (loopback in the container is
#     #                                           unreachable from the host)
#   chmod 600 config.json               # it holds tokens
#   mkdir -p archive
#   sudo chown 65532:65532 config.json archive   # image runs as 65532:65532
#   docker compose up -d
#
# Ownership is the one thing that bites: the container is NOT root, so a
# 0600 config.json owned by your login cannot be read ("permission denied"),
# and a 0644 one is refused as insecure. Either chown to 65532:65532 (above) or
# uncomment "user:" below to run the containers as your own uid instead.
#
# See docs/docker.md and docs/mcp.md.

services:
  # Backup service: runs a pass, waits backup.every, runs again. Both the
  # schedule ("every") and everything else come from config.json.
  backup:
    image: ghcr.io/martinverges/discord-backup:latest
    restart: unless-stopped
    # user: "1000:1000"        # alternative to chown 65532:65532 (use id -u:id -g)
    volumes:
      - ./archive:/data
      - ./config.json:/etc/discord-backup.json:ro
    command:
      - --config
      - /etc/discord-backup.json

  # Read-only MCP server over HTTP. Mounts the same archive read-only, because
  # the MCP never writes to it.
  mcp:
    image: ghcr.io/martinverges/discord-backup:latest
    restart: unless-stopped
    # user: "1000:1000"        # must match the owner of config.json/archive
    volumes:
      - ./archive:/data:ro
      - ./config.json:/etc/discord-backup.json:ro
    command:
      - mcp
      - --config
      - /etc/discord-backup.json
      - --http
    ports:
      # Keep it on localhost; put a TLS reverse proxy in front to expose it.
      - "127.0.0.1:8765:8765"
    healthcheck:
      # distroless has no shell/curl, so the binary probes its own endpoint.
      test: ["CMD", "/usr/local/bin/discord-backup", "healthcheck", "--config", "/etc/discord-backup.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
