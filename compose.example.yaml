# Example: keep an archive fresh and serve it read-only over MCP/HTTP, both
# as compose services. Copy to compose.yaml and adjust:
#
#   cp compose.example.yaml compose.yaml
#   cp mcp.example.json mcp.json          # set "archive_dir": "/data"
#                                         # keep "token_file": "/token", or
#                                         # inline the bot token as "token"
#   chmod 600 mcp.json                    # it holds tokens
#   printf '%s' "$BOT_TOKEN" > token && chmod 600 token
#
# The container runs as uid:gid 65532:65532, so the bind-mounted paths must be
# readable/writable by that user:
#
#   mkdir -p archive
#   sudo chown 65532:65532 archive mcp.json token
#
# The MCP reads no environment variables: the bot token comes from mcp.json
# ("token") or from the file it points to ("token_file"). Only the backup takes
# the token as a flag. See docs/docker.md and docs/mcp.md.

services:
  # Self-scheduling backup: runs a pass, waits --every after it finished, then
  # runs again. No cron and no host scheduler needed (compose has neither).
  # Change "15m" to taste; a failing pass is retried on the next tick.
  backup:
    image: ghcr.io/martinverges/discord-backup:latest
    restart: unless-stopped
    volumes:
      - ./archive:/data
      - ./token:/token:ro
    command:
      - --guild
      - YOUR_SERVER_ID
      - --out
      - /data
      - --token-file
      - /token
      - --download-attachments
      - --every
      - 15m

  # Read-only MCP server over HTTP. Keeps running; the archive is mounted
  # read-only because the MCP never writes to it.
  mcp:
    image: ghcr.io/martinverges/discord-backup:latest
    restart: unless-stopped
    volumes:
      - ./archive:/data:ro
      - ./mcp.json:/etc/mcp.json:ro
      # Only needed when mcp.json uses "token_file" instead of "token".
      - ./token:/token:ro
    command:
      - mcp
      - --config
      - /etc/mcp.json
      - --http
      - --addr
      - 0.0.0.0:8765
    ports:
      # Keep it on localhost; put a TLS reverse proxy in front to expose it.
      - "127.0.0.1:8765:8765"
    healthcheck:
      # distroless has no shell/curl, so the binary probes its own endpoint.
      test: ["CMD", "/usr/local/bin/discord-backup", "healthcheck", "--url", "http://127.0.0.1:8765/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
